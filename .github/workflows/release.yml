# Publishes the installation bundle: compose files, Caddy config, templates and spartaskctl.
#
# Release:  git tag v1.0.0 && git push origin v1.0.0
# Assets:   spartask-deploy-linux-amd64.tar.gz, spartask-deploy-linux-arm64.tar.gz,
#           spartask-deploy-windows-amd64.zip  (stable names: .../releases/latest/download/<asset>)
#
# Optional repository variable SPARTASK_VERSION: default Spartask release offered by `install`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: spartaskctl/go.mod
      - name: Test
        working-directory: spartaskctl
        run: go vet ./... && go test ./...
      - name: Build bundles
        env:
          DEFAULT_VERSION: ${{ vars.SPARTASK_VERSION }}
        run: |
          set -eu
          mkdir -p dist
          files="compose.yml compose.marketplace.yml caddy .env.example marketplace.env.example README.md"
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; name="spartask-deploy-$os-$arch"
            stage="dist/$name/spartask-deploy"; mkdir -p "$stage"
            cp -r $files "$stage/"
            bin=spartaskctl; [ "$os" = windows ] && bin=spartaskctl.exe
            (cd spartaskctl && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.toolVersion=${GITHUB_REF_NAME} -X main.defaultVersion=${DEFAULT_VERSION}" \
              -o "../$stage/$bin" .)
            if [ "$os" = windows ]; then
              (cd "dist/$name" && zip -qr "../$name.zip" spartask-deploy)
            else
              tar -C "dist/$name" -czf "dist/$name.tar.gz" spartask-deploy
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
