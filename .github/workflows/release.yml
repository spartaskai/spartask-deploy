# Publishes the installation bundle: compose files, Caddy config, templates and spartaskctl.
#
# Release:  git tag v1.0.0 && git push origin v1.0.0
# Assets:   spartask-deploy-linux-amd64.tar.gz, spartask-deploy-windows-amd64.zip, install.sh,
#           install.ps1, SHA256SUMS (x86_64 only: the Spartask image is built for linux/amd64)
#           (stable names: .../releases/latest/download/<asset>; get.spartask.ai redirects to
#           .../latest/download/install.sh, get.spartask.ai/windows to .../install.ps1)
#
# Optional repository variable SPARTASK_VERSION: default Spartask release offered by `install`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: spartaskctl/go.mod
      - name: Test
        working-directory: spartaskctl
        run: go vet ./... && go test ./...
      - name: Check install.sh
        run: sh -n install.sh
      - name: Check install.ps1
        shell: pwsh
        run: |
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$e)
          if ($e) { $e | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
      - name: Build bundles
        env:
          DEFAULT_VERSION: ${{ vars.SPARTASK_VERSION }}
        run: |
          set -eu
          mkdir -p dist
          files="compose.yml compose.marketplace.yml caddy demo .env.example marketplace.env.example README.md"
          for target in linux/amd64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; name="spartask-deploy-$os-$arch"
            stage="dist/$name/spartask-deploy"; mkdir -p "$stage"
            cp -r $files "$stage/"
            bin=spartaskctl; [ "$os" = windows ] && bin=spartaskctl.exe
            (cd spartaskctl && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.toolVersion=${GITHUB_REF_NAME} -X main.defaultVersion=${DEFAULT_VERSION}" \
              -o "../$stage/$bin" .)
            if [ "$os" = windows ]; then
              (cd "dist/$name" && zip -qr "../$name.zip" spartask-deploy)
            else
              tar -C "dist/$name" -czf "dist/$name.tar.gz" spartask-deploy
            fi
          done
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum *.tar.gz *.zip install.sh install.ps1 > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/install.sh dist/install.ps1 dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
